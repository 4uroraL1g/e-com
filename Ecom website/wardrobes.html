<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wardrobes - E-Shop Clone</title>
<link rel="stylesheet" href="website.css" />
<link rel="stylesheet" href="darkmode.css" />
</head>
<body>
<header>
  <div class="header-left">
    <a href="website.html" class="logo">E-Shop</a>
    <a href="website.html" class="home-button">Home</a>
  </div>
  <div class="search-container">
    <input type="text" placeholder="Search product..." id="searchBox" />
    <button onclick="searchProduct()">Search</button>
  </div>
  <div class="header-right">
<a href="cart.html" class="cart">🛒 <span id="cartCount">0</span></a>
<button id="darkModeToggle">Toggle Dark Mode</button>
    <div class="user-menu">
      <div class="user-icon">👤</div>
      <div class="dropdown">
        <a href="#">My account</a>
        <a href="#">My order</a>
        <a href="#">Setting</a>
        <a href="#">Sign out</a>
      </div>
    </div>
  </div>
</header>

<nav class="category-nav">
  <div class="category-list">
    <a href="beds.html" class="category-btn"><span class="category-icon">🛏️</span>Beds</a>
    <a href="chairs.html" class="category-btn"><span class="category-icon">🪑</span>Chairs</a>
    <a href="sofas.html" class="category-btn"><span class="category-icon">🛋️</span>Sofas</a>
    <a href="tables.html" class="category-btn"><span class="category-icon">┬─┬</span>Tables</a>
    <a href="tv.html" class="category-btn"><span class="category-icon">📺</span>TV</a>
    <a href="wardrobes.html" class="category-btn"><span class="category-icon">🚪</span>Wardrobes</a>
    <a href="cabinet.html" class="category-btn"><span class="category-icon">🗄️</span>Cabinets</a>
  </div>
</nav>

<main id="category-products" class="category">
  <h2>Wardrobes</h2>
  <div class="products" id="productsContainer">
    <!-- Products will be loaded here -->
  </div>
</main>

<footer>
  <p>&copy; 2025 E-Shop. All rights reserved.</p>
</footer>

<script src="website.js"></script>
<script>
  // Load products for Wardrobes category only
  window.onload = () => {
    const categoryName = "Wardrobes";
    const category = categories.find(cat => cat.name === categoryName);
    const container = document.getElementById("productsContainer");

    function renderProducts(products) {
      container.innerHTML = "";
      if (products.length === 0) {
        container.innerHTML = "<p>No products found in this category.</p>";
        return;
      }
      products.forEach(product => {
        const productHTML = `
          <div class="product">
            <img src="${product.img}" alt="${product.name}" />
            <h3>${product.name}</h3>
            <p>${product.price.toLocaleString()} VND</p>
            <p>Height: ${product.height}</p>
            <p>Width: ${product.width}</p>
            <p>Depth: ${product.depth}</p>
            <button class="add-to-cart" onclick="addToCart(${product.id})">Add to cart</button>
          </div>
        `;
        container.innerHTML += productHTML;
      });
    }

    function searchCategoryProducts() {
      const query = document.getElementById("searchBox").value.toLowerCase().trim();
      if (!category) {
        container.innerHTML = "<p>No products found in this category.</p>";
        return;
      }
      if (!query) {
        renderProducts(category.products);
        return;
      }
      const filtered = category.products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    // Initial render of all products
    renderProducts(category.products);

    // Add event listener for search input
    const searchInput = document.getElementById("searchBox");
    searchInput.addEventListener("input", searchCategoryProducts);

    // Optional: add event listener for search button
    const searchButton = searchInput.nextElementSibling;
    if (searchButton) {
      searchButton.addEventListener("click", searchCategoryProducts);
    }
  };
</script>
</body>
</html>
