<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TV - E-Shop Clone</title>
<link rel="stylesheet" href="{{ url_for('static', filename='website.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='darkmode.css') }}" />
</head>
<body>
<header>
  <a href="{{ url_for('home') }}" class="logo">E-Shop</a>
  <a href="{{ url_for('chat') }}" class="logo">AI Assistant</a>
  <div class="search-container">
    <input type="text" placeholder="Search product..." id="searchBox" />
    <button onclick="searchProduct()">Search</button>
  </div>
  <div class="header-right">
<a href="{{ url_for('cart') }}" class="cart">🛒 <span id="cartCount">0</span></a>
    <button id="darkModeToggle">Toggle Dark Mode</button>
    <div class="user-menu">
      <div class="user-icon">👤</div>
      <div class="dropdown">
        <a href="{{ url_for('signup') }}" id="loginLink">Sign up / Login</a>
        <a href="{{ url_for('account') }}" id="myAccountLink">My Account</a>
        <a href="#">My order</a>
        <a href="{{ url_for('setting') }}">Setting</a>
        <a href="#" id="logoutBtn" style="display:none;">Sign out</a>
      </div>
    </div>
  </div>
</header>

<nav class="category-nav">
  <div class="category-list">
    <a href="{{ url_for('beds') }}" class="category-btn"><span class="category-icon">🛏️</span>Beds</a>
    <a href="{{ url_for('chairs') }}" class="category-btn"><span class="category-icon">🪑</span>Chairs</a>
    <a href="{{ url_for('sofas') }}" class="category-btn"><span class="category-icon">🛋️</span>Sofas</a>
    <a href="{{ url_for('tables') }}" class="category-btn"><span class="category-icon">┬─┬</span>Tables</a>
    <a href="{{ url_for('tv') }}" class="category-btn"><span class="category-icon">📺</span>TV</a>
    <a href="{{ url_for('wardrobes') }}" class="category-btn"><span class="category-icon">🚪</span>Wardrobes</a>
    <a href="{{ url_for('cabinet') }}" class="category-btn"><span class="category-icon">🗄️</span>Cabinets</a>
  </div>
</nav>

<main id="category-products" class="category">
  <h2>TV</h2>
  <div class="products" id="productsContainer">
    <!-- Products will be loaded here -->
  </div>
</main>

<footer>
  <p>&copy; 2025 E-Shop. All rights reserved.</p>
</footer>

<script src="{{ url_for('static', filename='website.js') }}"></script>
<script src="{{ url_for('static', filename='init.js') }}"></script>
<script src="{{ url_for('static', filename='darkmode.js') }}"></script>

<script>
  // Load products for TV category only
  window.onload = () => {
    const categoryName = "TV";
    const category = categories.find(cat => cat.name === categoryName);
    const container = document.getElementById("productsContainer");
    container.innerHTML = "";
    if (category && category.products.length > 0) {
      category.products.forEach(product => {
        const productHTML = `
          <div class="product">
            <img src="${product.img}" alt="${product.name}" />
            <h3>${product.name}</h3>
            <p>${product.price.toLocaleString()} VND</p>
            <p>Height: ${product.height}</p>
            <p>Width: ${product.width}</p>
            <p>Depth: ${product.depth}</p>
            <button class="add-to-cart" onclick="addToCart(${product.id})">Add to cart</button>
          </div>
        `;
        container.innerHTML += productHTML;
      });
    } else {
      container.innerHTML = "<p>No products found in this category.</p>";
    }
  };
</script>
<script src="{{ url_for('static', filename='user.js') }}"></script>
</body>
</html>
