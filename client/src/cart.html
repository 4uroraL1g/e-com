<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giỏ hàng - E-Shop</title>
  <link rel="stylesheet" href="website.css" />
  <link rel="stylesheet" href="darkmode.css" />
  <style>
    .cart-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }
    .cart-item {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }
    .cart-item img {
      width: 100px;
      height: auto;
      margin-right: 20px;
    }
    .cart-item-details {
      flex-grow: 1;
    }
    .cart-item-name {
      font-size: 1.2em;
      margin-bottom: 5px;
    }
    .cart-item-price {
      color: #555;
    }
    .cart-total {
      text-align: right;
      font-size: 1.4em;
      margin-top: 20px;
      font-weight: bold;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #007bff;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a class="logo">E-Shop</a>
      <a href="website.html" class="home-button">Home</a>
    </div>
    <button id="darkModeToggle">Toggle Dark Mode</button>
  </header>

  <div class="cart-container">
    <h1>Your Shopping Cart</h1>
    <div id="cartItemsContainer"></div>
    <div class="cart-total" id="cartTotal"></div>
    <button id="buyButton" style="margin-top: 10px; padding: 10px 20px; font-size: 1em; float: right;" onclick="window.location.href='checkout.html'">Ready to check out</button>
    <a href="website.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    function loadCart() {
      const cartItemsContainer = document.getElementById('cartItemsContainer');
      const cartTotalElem = document.getElementById('cartTotal');
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cartItemsContainer.innerHTML = '';

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p>Cart is empty!</p>';
        cartTotalElem.textContent = '';
        document.getElementById('buyButton').style.display = 'none';
        return;
      } else {
        document.getElementById('buyButton').style.display = 'inline-block';
      }

      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        const itemElem = document.createElement('div');
        itemElem.className = 'cart-item';
        itemElem.innerHTML = `
          <img src="${item.img}" alt="${item.name}" />
          <div class="cart-item-details">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${item.price.toLocaleString()} VND</div>
          </div>
          <button class="delete-btn" data-index="${index}">Delete</button>
        `;
        cartItemsContainer.appendChild(itemElem);
      });

      cartTotalElem.textContent = 'Tổng cộng: ' + total.toLocaleString() + ' VND';

      // Add event listeners for delete buttons
      const deleteButtons = document.querySelectorAll('.delete-btn');
      deleteButtons.forEach(button => {
        button.addEventListener('click', function() {
          const idx = this.getAttribute('data-index');
          deleteCartItem(parseInt(idx));
        });
      });
    }

    function deleteCartItem(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (index >= 0 && index < cart.length) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        loadCart();
      }
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const cartCountElem = document.getElementById('cartCount');
      if (cartCountElem) {
        cartCountElem.textContent = cart.length;
      }
    }

    document.getElementById('buyButton').addEventListener('click', () => {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        alert('Cart is empty!');
        return;
      }
      alert('Thank you for your purchase! Your total order amount is: ' + cart.reduce((sum, item) => sum + item.price, 0).toLocaleString() + ' VND');
      localStorage.removeItem('cart');
      updateCartCount();
      loadCart();
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadCart();
      updateCartCount();
    });
  </script>
  <script src="darkmode.js"></script>
</body>
</html>
